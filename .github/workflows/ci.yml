name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: Integration (PostgreSQL, MySQL, MongoDB, S3)
    runs-on: ubuntu-latest
    env:
      INSIGHTS_FORGE_TEST_POSTGRES_URL: postgresql+psycopg://analyst:analyst@localhost:55432/shop
      INSIGHTS_FORGE_TEST_MYSQL_URL: mysql+pymysql://analyst:analyst@localhost:53306/shop
      INSIGHTS_FORGE_TEST_MONGO_URL: mongodb://analyst:analyst@localhost:57017/shop
      INSIGHTS_FORGE_TEST_S3_URL: s3://shop/sales.csv
      AWS_ENDPOINT_URL: http://localhost:59000
      AWS_ACCESS_KEY_ID: analyst
      AWS_SECRET_ACCESS_KEY: analyst-secret
      AWS_REGION: us-east-1
      AWS_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Start test databases (same compose file as local development)
        run: docker compose up -d --wait
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration
      - name: Database logs
        if: failure()
        run: docker compose logs
