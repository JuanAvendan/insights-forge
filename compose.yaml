# Local test databases loaded with data/sample/sales.csv.
#
#   docker compose up -d --wait
#
#   PostgreSQL  postgresql+psycopg://analyst:analyst@localhost:55432/shop
#   MySQL       mysql+pymysql://analyst:analyst@localhost:53306/shop
#   MongoDB     mongodb://analyst:analyst@localhost:57017/shop
#   S3          s3://shop/sales.csv  with  AWS_ENDPOINT_URL=http://localhost:59000
#               AWS_ACCESS_KEY_ID=analyst  AWS_SECRET_ACCESS_KEY=analyst-secret
#               AWS_REGION=us-east-1  AWS_ALLOW_HTTP=true
#
# `analyst` can only read (least privilege). These credentials are for local
# development only. Non-default host ports avoid clashing with services you
# may already run on the standard ports.
name: insights-forge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./data/sample:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d shop"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    # The entrypoint chowns the secure-file-priv directory, which fails on a read-only
    # mount, so the restriction is lifted for this local-only test server.
    command: ["--secure-file-priv="]
    ports:
      - "53306:3306"
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
      - ./data/sample:/seed:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: forge
      MONGO_INITDB_ROOT_PASSWORD: forge
      MONGO_INITDB_DATABASE: shop
    ports:
      - "57017:27017"
    volumes:
      - ./docker/mongo:/docker-entrypoint-initdb.d:ro
      - ./data/sample:/seed:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "forge", "-p", "forge", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  s3:
    # S3-compatible gateway serving a directory as a bucket: ./data/sample is the
    # `shop` bucket. Mounted read-only, so the storage cannot be modified at all.
    image: versity/versitygw:v1.11.0
    command: ["--access", "analyst", "--secret", "analyst-secret", "posix", "--nometa", "/data"]
    ports:
      - "59000:7070"
    volumes:
      - ./data/sample:/data/shop:ro
